name: Deploy SpaceMap to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh the bundled TLE snapshot every 6 hours so the deployed site
  # always ships with a recent catalog even if nobody's pushing code.
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Use root base URL for custom domain
        id: base
        run: |
          echo "base=/" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run typecheck

      - name: Build public catalog assets
        env:
          UA: 'SpaceMap/1.0 (+https://github.com/${{ github.repository }})'
        run: |
          mkdir -p frontend/public/data
          node frontend/scripts/build-public-catalog.mjs frontend/public/data

      - name: Fetch legacy TLE fallback
        # Keep a compact legacy TLE bundle around as a fallback path for local
        # dev / edge cases where the chunk manifest is unavailable.
        env:
          UA: 'SpaceMap/1.0 (+https://github.com/${{ github.repository }})'
        run: |
          mkdir -p frontend/public/data
          set +e
          fetch_group() {
            local group="$1"
            local out="$2"
            curl -fsSL -A "$UA" \
              "https://celestrak.org/NORAD/elements/gp.php?GROUP=${group}&FORMAT=tle" \
              >> "$out"
          }
          fetch_group active frontend/public/data/tles.txt || true
          if [ ! -s frontend/public/data/tles.txt ]; then
            curl -fsSL "https://spacemap.earth/data/tles.txt" -o frontend/public/data/tles.txt
          fi
          if [ ! -s frontend/public/data/tles.txt ]; then
            echo "::error::TLE fetch failed — no data bundled."
            exit 1
          fi
          LINES=$(wc -l < frontend/public/data/tles.txt)
          echo "Bundled TLE lines: $LINES (~$((LINES/3)) satellites)"

      - name: Build frontend
        env:
          VITE_BASE_URL: ${{ steps.base.outputs.base }}
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
        run: npm run build -w frontend


      - name: Fetch Launch Library snapshots
        # Browser-origin requests to Launch Library can rate-limit quickly, so
        # bundle a recent server-side snapshot for the marketing feature panels.
        # Runtime code still has a live fallback and local stale cache.
        run: |
          mkdir -p frontend/dist/data
          set +e

          curl -fsSL --max-time 45 -A "SpaceMap/1.0 (+https://github.com/${{ github.repository }})" \
            "https://ll.thespacedevs.com/2.2.0/launch/upcoming/?limit=10&mode=list&hide_recent_previous=true" \
            -o frontend/dist/data/launches.json
          if [ ! -s frontend/dist/data/launches.json ]; then
            echo "::warning::Launch snapshot fetch failed - frontend will use runtime cache/fallback"
            rm -f frontend/dist/data/launches.json
          fi

          node --input-type=module <<'NODE'
          import { writeFile, rm } from 'node:fs/promises';

          const ua = 'SpaceMap/1.0 (+https://github.com/${{ github.repository }})';
          const headers = { 'User-Agent': ua };
          try {
            const stationRes = await fetch('https://ll.thespacedevs.com/2.2.0/spacestation/4/?format=json', { headers });
            if (!stationRes.ok) throw new Error(`station ${stationRes.status}`);
            const station = await stationRes.json();
            const expeditionUrl = station.active_expeditions?.[0]?.url;
            if (!expeditionUrl) throw new Error('no active ISS expedition URL');

            const expeditionRes = await fetch(expeditionUrl, { headers });
            if (!expeditionRes.ok) throw new Error(`expedition ${expeditionRes.status}`);
            const expedition = await expeditionRes.json();
            const crew = (expedition.crew ?? [])
              .filter((member) => member.astronaut?.name)
              .map((member) => ({
                name: member.astronaut.name,
                role: member.role?.name ?? member.role?.role ?? 'Crew',
                agencyAbbrev: member.astronaut.agency?.abbrev ?? member.astronaut.agency?.name,
                countryCode: member.astronaut.nationality?.alpha_2_code?.toUpperCase(),
              }));
            await writeFile(
              'frontend/dist/data/iss-crew.json',
              JSON.stringify(
                {
                  fetchedAt: Date.now(),
                  expeditionName: expedition.name ?? null,
                  crew,
                },
                null,
                2,
              ),
            );
          } catch (err) {
            console.log(`::warning::ISS crew snapshot fetch failed - ${err instanceof Error ? err.message : err}`);
            await rm('frontend/dist/data/iss-crew.json', { force: true });
          }
          NODE

      - name: Build HYG star catalog
        # HYG-Database keeps rearranging its layout — repo-relative paths that
        # worked six months ago 404 now. Try several known URLs and take the
        # first that gives us a plausibly-large CSV. Non-fatal: if all miss
        # the frontend falls back to its hardcoded 60 bright stars.
        run: |
          mkdir -p frontend/dist/data
          set +e
          URLS=(
            "https://raw.githubusercontent.com/astronexus/HYG-Database/main/hyg/v3/hygdata_v3.csv"
            "https://raw.githubusercontent.com/astronexus/HYG-Database/master/hyg/v3/hygdata_v3.csv"
            "https://raw.githubusercontent.com/astronexus/HYG-Database/main/hyg/CURRENT/hygdata_v41.csv"
            "https://raw.githubusercontent.com/astronexus/HYG-Database/main/data/hygdata_v3.csv"
            "https://cdn.jsdelivr.net/gh/astronexus/HYG-Database/hyg/v3/hygdata_v3.csv"
            "https://cdn.jsdelivr.net/gh/astronexus/HYG-Database@master/hyg/v3/hygdata_v3.csv"
          )
          FETCHED=""
          for url in "${URLS[@]}"; do
            echo "Trying: $url"
            if curl -fsSL --max-time 60 -A "SpaceMap/1.0" "$url" -o /tmp/hyg.csv; then
              SIZE=$(wc -c < /tmp/hyg.csv 2>/dev/null || echo 0)
              echo "  → $SIZE bytes"
              # Real HYG catalogs are 5-40 MB. Anything smaller is an error page.
              if [ "$SIZE" -gt 1000000 ]; then
                FETCHED="$url"
                break
              fi
            fi
          done
          if [ -n "$FETCHED" ]; then
            echo "Using: $FETCHED"
            node frontend/scripts/build-stars.mjs /tmp/hyg.csv frontend/dist/data/stars.bin 7.0
            ls -la frontend/dist/data/stars.bin
          else
            echo "::warning::All HYG URLs failed — hardcoded 60-star fallback will be used"
          fi

      - name: Fetch Natural Earth country outlines
        # Bundled with the site so the "Country outlines" overlay works
        # without a runtime CORS call. jsdelivr mirrors GitHub with a CDN in
        # front, so this is fast + reliable in CI.
        run: |
          mkdir -p frontend/dist/data
          set +e
          curl -fsSL \
            "https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector/geojson/ne_110m_admin_0_countries.geojson" \
            -o frontend/dist/data/countries.geojson
          if [ ! -s frontend/dist/data/countries.geojson ]; then
            echo "::warning::Country GeoJSON fetch failed — overlay will be unavailable"
            rm -f frontend/dist/data/countries.geojson
          else
            echo "Countries GeoJSON: $(wc -c < frontend/dist/data/countries.geojson) bytes"
          fi

      - name: Add SPA 404 shim
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Add .nojekyll marker
        # Prevents Jekyll from ever re-processing the artifact.
        run: touch frontend/dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
